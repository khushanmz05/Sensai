<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sensai</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 720px; margin: 2rem auto; padding: 0 1rem; }
    #log { white-space: pre-wrap; border: 1px solid #ccc; border-radius: 6px; padding: 1rem; min-height: 8rem; }
    .user { font-weight: bold; margin-top: 1rem; }
    .error { color: #b00020; }
    form { display: flex; gap: .5rem; margin-top: 1rem; }
    input { flex: 1; padding: .5rem; }
    #status { color: #666; font-size: .9rem; margin-top: .5rem; }
  </style>
</head>
<body>
  <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #eee; padding-bottom: .8rem; margin-bottom: 1.5rem;">
    <h1 style="margin: 0; font-size: 1.6rem;">Sensai</h1>
    <nav>
      <a href="/dashboard" style="text-decoration: none; color: #0066cc; font-weight: 500;">Metrics Dashboard (EV3) →</a>
    </nav>
  </div>
  <div style="margin-bottom: 1rem; display: flex; gap: .5rem; align-items: center;">
    <label for="persona"><strong>Persona:</strong></label>
    <select id="persona" style="padding: .4rem; border-radius: 4px; border: 1px solid #ccc;">
      <option value="">Default (Sensai)</option>
    </select>
  </div>
  <div id="log"></div>
  <form id="form">
    <input id="message" autocomplete="off" placeholder="Ask something">
    <button id="send">Send</button>
    <button id="cancel" type="button" disabled style="padding: .5rem 1rem; border-radius: 4px; border: 1px solid #ccc; background: #fff; cursor: pointer;">Cancel</button>
  </form>
  <div id="status">Ready.</div>
  <script>
    const log = document.getElementById('log');
    const form = document.getElementById('form');
    const input = document.getElementById('message');
    const send = document.getElementById('send');
    const cancel = document.getElementById('cancel');
    const status = document.getElementById('status');
    const personaSelect = document.getElementById('persona');

    let currentSource = null;
    let currentRunId = null;

    fetch('/api/personas')
      .then(res => res.ok ? res.json() : [])
      .then(personas => {
        personas.forEach(p => {
          const opt = document.createElement('option');
          opt.value = p.id;
          opt.textContent = `${p.name} (${p.role})`;
          personaSelect.appendChild(opt);
        });
      })
      .catch(() => {});

    function addLine(className, text) {
      const line = document.createElement('div');
      line.className = className;
      line.textContent = text;
      log.appendChild(line);
      return line;
    }

    function finish(text) {
      status.textContent = text;
      send.disabled = false;
      cancel.disabled = true;
      if (currentSource) {
        currentSource.close();
        currentSource = null;
      }
      currentRunId = null;
    }

    cancel.addEventListener('click', async () => {
      if (!currentRunId) return;
      cancel.disabled = true;
      status.textContent = 'Cancelling run ' + currentRunId + '...';
      try {
        await fetch('/api/runs/' + currentRunId + '/cancel', { method: 'POST' });
      } catch (err) {
        console.error('Cancel request failed:', err);
      }
    });

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const message = input.value.trim();
      if (!message) return;
      const personaId = personaSelect.value || null;
      input.value = '';
      send.disabled = true;
      cancel.disabled = false;
      addLine('user', 'You: ' + message);
      const reply = addLine('assistant', '');

      let runId;
      try {
        const response = await fetch('/api/runs', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({message, persona_id: personaId}),
        });
        if (!response.ok) throw new Error('HTTP ' + response.status);
        runId = (await response.json()).run_id;
      } catch (error) {
        addLine('error', 'Error: ' + error.message);
        return finish('Failed.');
      }

      currentRunId = runId;
      status.textContent = 'Run ' + runId + ': running';
      currentSource = new EventSource('/api/runs/' + runId + '/events');
      currentSource.addEventListener('text_delta', (e) => {
        reply.textContent += JSON.parse(e.data).payload.text;
      });
      currentSource.addEventListener('done', (e) => {
        finish('Run ' + runId + ': ' + JSON.parse(e.data).payload.status);
      });
      // Fires for both server "error" events (with data) and lost connections.
      currentSource.onerror = (e) => {
        if (e.data) {
          addLine('error', 'Error: ' + JSON.parse(e.data).payload.message);
          return;
        }
        if (currentSource && currentSource.readyState === EventSource.CLOSED) return;
        addLine('error', 'Error: connection to server lost.');
        finish('Run ' + runId + ': failed');
      };
    });
  </script>
</body>
</html>
