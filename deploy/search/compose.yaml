name: sensai-search
services:
  searxng:
    image: docker.io/searxng/searxng:latest
    ports:
      - "127.0.0.1:8088:8080"
    environment:
      SEARXNG_SECRET: "${SENSAI_SEARCH_SECRET:?Set SENSAI_SEARCH_SECRET before starting}"
      SEARXNG_BIND_ADDRESS: "0.0.0.0"
      SEARXNG_PORT: "8080"
    volumes:
      - ./settings.yml:/etc/searxng/settings.yml:ro
      - ./limiter.toml:/etc/searxng/limiter.toml:ro
      - search-cache:/var/cache/searxng
volumes:
  search-cache:
